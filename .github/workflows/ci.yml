name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: true

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    # Before the package is built: a build task that can fail a customer's
    # build must not be packed.
    - name: Run tests
      run: dotnet test tests/Avalonia.BuildServices.Tests/Avalonia.BuildServices.Tests.csproj

    - name: Run Nuke
      run: dotnet run --project build/_build.csproj

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Nuget package
        path: ./artifacts/packages/*.nupkg

    # Standalone copy of the per-package SBOM that CreateSbom also embeds into the .nupkg.
    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: ./artifacts/sbom/*.cdx.json
